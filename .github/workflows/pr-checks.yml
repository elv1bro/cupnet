name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-and-integration:
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: azuretls-go/go.sum

      - name: Build AzureTLS Go worker (current platform)
        run: npm run build:go:local

      - name: Unit tests (Vitest + Go)
        run: npm run test:unit:all

      - name: Integration tests
        run: npm test

      - name: E2E smoke (Playwright + Electron)
        run: npm run test:e2e:smoke
