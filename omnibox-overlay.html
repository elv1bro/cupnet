<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:">
<style>
*, *::before, *::after { box-sizing: border-box; }
html, body {
    margin: 0; padding: 0;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
}
#backdrop {
    position: fixed; inset: 0;
    background: transparent;
}
#backdrop.veil {
    background: rgba(0, 0, 0, 0.42);
}
#dropdown {
    position: relative;
    display: flex;
    flex-direction: column;
    --content-max: 960px;
    max-height: min(58vh, 440px);
    border-radius: 12px;
    background: #161b22;
    border: 1px solid #30363d;
    box-shadow: 0 12px 36px rgba(0, 0, 0, 0.5);
    overflow: hidden;
    z-index: 2;
    margin-top: 4px; /* overridden from payload topGap */
}
#dropdown.attached {
    border-top: none;
    border-radius: 0 0 12px 12px;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
}
#items {
    list-style: none;
    margin: 0;
    padding: 6px;
    overflow-y: auto;
    flex: 1;
    min-height: 0;
}
#items::-webkit-scrollbar { width: 6px; }
#items::-webkit-scrollbar-track { background: transparent; }
#items::-webkit-scrollbar-thumb { background: rgba(139, 148, 158, 0.25); border-radius: 3px; }
.item {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    max-width: var(--content-max);
    padding: 8px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    color: #e6edf3;
    transition: background 80ms ease;
}
.item:hover, .item.active {
    background: rgba(88, 166, 255, 0.12);
}
.item-icon {
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    margin-top: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #8b949e;
    opacity: 0.95;
}
.item-icon svg { width: 16px; height: 16px; }
.item-icon img.item-favicon {
    width: 16px;
    height: 16px;
    object-fit: contain;
    border-radius: 2px;
    display: block;
}
.item-icon-fallback {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
}
.item-main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
}
.item-label-row {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.item-label-row b { color: #fff; font-weight: 600; }
.item-url-preview {
    font-size: 11px;
    color: #656d76;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.item-label {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.item-cat {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #8b949e;
    flex-shrink: 0;
}
.item-kbd {
    font-size: 11px;
    color: #656d76;
    flex-shrink: 0;
}
.item-badge {
    display: inline-block;
    margin-left: 8px;
    padding: 0 6px;
    border-radius: 999px;
    font-size: 10px;
    line-height: 16px;
    vertical-align: 1px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #f59e0b;
    background: rgba(245, 158, 11, 0.16);
    border: 1px solid rgba(245, 158, 11, 0.4);
}
.item-del {
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    margin-top: 1px;
    border: none;
    border-radius: 4px;
    background: transparent;
    color: #656d76;
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    opacity: 0;
    padding: 0;
}
.item:hover .item-del, .item.active .item-del { opacity: 1; }
.item-del:hover { background: rgba(248, 81, 73, 0.18); color: #f85149; }
#hint {
    max-width: var(--content-max);
}
#hint {
    padding: 6px 10px;
    border-top: 1px solid #30363d;
    font-size: 11px;
    color: #656d76;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.empty {
    padding: 16px 10px;
    color: #8b949e;
    text-align: center;
    font-size: 13px;
}
</style>
</head>
<body>
<div id="backdrop" class="transparent"></div>
<div id="dropdown" style="display:none">
    <ul id="items" role="listbox" aria-label="Suggestions"></ul>
    <div id="hint"></div>
</div>
<script src="omnibox-overlay-renderer.js"></script>
</body>
</html>
