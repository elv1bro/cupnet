<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http:">
    <title>[CupNet]</title>
    <link rel="stylesheet" href="shared-dark-theme.css">
    <link rel="stylesheet" href="styles.css">
    <script src="cookies-page-match.js"></script>
    <script src="favicon-cache.js"></script>
</head>
<body>

<!-- ── Tab bar ──────────────────────────────────────────────────────────────── -->
<div id="tab-bar">
    <div id="tab-list">
        <button id="new-tab-btn" title="New tab (Ctrl+T)">
            <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                <path d="M7 2v10M2 7h10"/>
            </svg>
        </button>
    </div>
</div>

<!-- ── Navigation toolbar ───────────────────────────────────────────────────── -->
<div id="browser-toolbar">

    <button type="button" id="win-switcher-toolbar-btn" class="tool-btn win-switcher-toolbar-btn--leading" title="Window switcher · Ctrl+`">
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <rect x="1" y="1" width="6" height="6" rx="1.2"/>
            <rect x="9" y="1" width="6" height="6" rx="1.2"/>
            <rect x="1" y="9" width="6" height="6" rx="1.2"/>
            <rect x="9" y="9" width="6" height="6" rx="1.2"/>
        </svg>
        <span class="tool-label">Switcher</span>
    </button>

    <!-- Nav buttons: icon only -->
    <button id="back-btn" class="nav-btn" title="Back (Alt+←)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 3L5 8l5 5"/>
        </svg>
    </button>
    <button id="forward-btn" class="nav-btn" title="Forward (Alt+→)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 3l5 5-5 5"/>
        </svg>
    </button>
    <button id="reload-btn" class="nav-btn" title="Reload (Ctrl+R)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M13.5 2.5v4h-4"/>
            <path d="M13.5 6.5A5.5 5.5 0 1 1 10 2.8"/>
        </svg>
    </button>
    <button id="home-btn" class="nav-btn" title="Home / Start Page">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1.5 7.5L8 2l6.5 5.5"/>
            <path d="M3.5 6.5V13h3.5V9.5h2V13H12.5V6.5"/>
        </svg>
    </button>

    <!-- Compact proxy status pill (opens Proxy Manager on click) -->
    <button id="pb-status-btn" class="proxy-pill-btn" title="Proxy status — click to open Proxy Manager">
        <span id="pb-dot" class="proxy-dot"></span>
        <span class="pb-text-col">
            <span id="pb-name">Direct</span>
            <span id="pb-detail" class="pb-detail"></span>
        </span>
        <span id="pb-mode-badge" class="pb-mode-badge" style="display:none"></span>
    </button>

    <!-- Address bar + command palette (omnibox: same field, Cmd/Ctrl+K) -->
    <div class="address-bar-container" id="address-bar-container">
        <button type="button" id="site-info-btn" class="site-info-btn" draggable="true" title="Site information · drag to copy URL" aria-label="Site information">
            <svg class="site-info-icon site-info-icon--secure" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 1a3 3 0 00-3 3v2H4a1 1 0 00-1 1v6a1 1 0 001 1h8a1 1 0 001-1V7a1 1 0 00-1-1h-1V4a3 3 0 00-3-3zm-1 5V4a1 1 0 112 0v2H7z"/></svg>
        </button>
        <div class="url-input-stack">
            <div id="url-display" class="url-display" aria-hidden="true"></div>
            <input type="text" id="url-input" placeholder="Type &gt; for commands, or enter a URL…" autocomplete="off" spellcheck="false" aria-autocomplete="list" aria-controls="command-palette-list" aria-expanded="false">
            <button type="button" id="url-clear-btn" class="url-clear-btn" hidden title="Clear" aria-label="Clear address bar">×</button>
        </div>
        <div id="loading-indicator"></div>
        <div id="url-omnibox-dropdown" class="url-omnibox-dropdown hidden" aria-hidden="true">
            <ul id="command-palette-list" class="command-palette-list" role="listbox" aria-label="Commands"></ul>
            <div id="url-omnibox-hint" class="command-palette-hint"></div>
        </div>
    </div>

    <!-- ── Unified tool dock ── -->
    <div id="tool-dock-mount-inline" class="tool-dock-mount">
    <div class="tool-dock">

        <!-- Log pill: [● toggle | Log #N  42] -->
        <div class="tool-log-pill" id="log-pill">
            <!-- Left: recording toggle -->
            <button id="log-toggle-btn" class="log-rec-toggle-area" title="Toggle recording (OFF)">
                <span class="rec-dot"></span>
                <span class="tool-label log-toggle-label">REC</span>
            </button>
            <!-- Right: open log viewer -->
            <button id="log-viewer-btn" class="log-open-area" title="Open Network Log viewer">
                <span class="log-pill-text">Log</span>
                <span id="log-session-num" class="log-pill-num">#—</span>
                <span id="log-entry-badge" class="log-badge" style="display:none">0</span>
            </button>
        </div>

        <span class="tool-sep"></span>

        <!-- DevTools -->
        <button id="devtools-btn" class="tool-btn" title="DevTools · F12">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5.5 4.5L2 8l3.5 3.5"/>
                <path d="M10.5 4.5L14 8l-3.5 3.5"/>
                <path d="M9.5 2.5l-3 11"/>
            </svg>
            <span class="tool-label">DevTools</span>
        </button>

        <!-- Cookie Manager -->
        <button id="cookies-btn" class="tool-btn" title="Cookie Manager — badge: cookies for current page URL" style="position:relative">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="8" cy="8" r="5.5"/>
                <circle cx="6" cy="6.5" r="0.9" fill="currentColor" stroke="none"/>
                <circle cx="10" cy="7"   r="0.9" fill="currentColor" stroke="none"/>
                <circle cx="7" cy="10.5" r="0.9" fill="currentColor" stroke="none"/>
                <circle cx="10.5" cy="10.5" r="0.7" fill="currentColor" stroke="none"/>
            </svg>
            <span class="tool-label">Cookies</span>
            <span id="cookie-page-badge" class="rules-hit-badge rules-hit-badge--cookies" aria-hidden="true"></span>
        </button>

        <!-- DNS Manager -->
        <button id="dns-btn" class="tool-btn" title="DNS Overrides Manager" style="position:relative">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="8" cy="8" r="5.5"/>
                <path d="M2.5 8h11"/>
                <path d="M8 2.5a8.2 8.2 0 0 1 0 11"/>
                <path d="M8 2.5a8.2 8.2 0 0 0 0 11"/>
            </svg>
            <span class="tool-label">DNS</span>
            <span id="dns-hit-badge" class="rules-hit-badge" aria-hidden="true"></span>
        </button>

        <!-- Global CORS bypass (MITM) -->
        <button id="cors-btn" class="tool-btn" title="CORS bypass (MITM) — OFF" aria-pressed="false">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M8 1.5L2.5 4v4c0 3.5 2.5 6 5.5 6.5 3-.5 5.5-3 5.5-6.5V4L8 1.5z"/>
                <path d="M6 8l1.5 1.5L11 6"/>
            </svg>
            <span class="tool-label">CORS</span>
        </button>

        <span class="tool-sep"></span>

        <!-- Request Editor -->
        <button id="req-editor-btn" class="tool-btn" title="Request Editor">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 4h12"/>
                <path d="M2 8h7"/>
                <path d="M2 12h5"/>
                <path d="M11 10l3 2-3 2"/>
            </svg>
            <span class="tool-label">Req Editor</span>
        </button>

        <!-- Rules & Intercept -->
        <button id="rules-btn" class="tool-btn" title="Rules &amp; Intercept" style="position:relative">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 3.5h12l-4.5 5v4l-3-1.5V8.5L2 3.5z"/>
            </svg>
            <span class="tool-label">Rules</span>
            <span id="rules-hit-badge" class="rules-hit-badge" aria-hidden="true"></span>
        </button>

        <!-- Page Analyzer -->
        <button id="analyzer-btn" class="tool-btn" title="Page Analyzer · Ctrl+Shift+A">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="7" cy="7" r="5"/>
                <path d="M11 11l3 3"/>
                <path d="M5 7h4"/>
                <path d="M7 5v4"/>
            </svg>
            <span class="tool-label">Analyzer</span>
        </button>

        <!-- In-page HTTP Lab -->
        <button id="http-lab-btn" class="tool-btn" title="HTTP Lab — in-page request tools on active tab">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2.5 4.5h11"/>
                <path d="M2.5 8h7"/>
                <path d="M2.5 11.5h4"/>
                <circle cx="12.5" cy="11.5" r="2"/>
                <path d="M12.5 10v3"/>
            </svg>
            <span class="tool-label">HTTP Lab</span>
        </button>

        <!-- Notes -->
        <button id="notes-btn" class="tool-btn" title="Site Notes">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 2.5h8a1 1 0 0 1 1 1v10l-2.5-2H4a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1z"/>
                <path d="M5 6h6M5 9h4"/>
            </svg>
            <span class="tool-label">Notes</span>
        </button>

        <!-- Credentials: unified fill + vault (long-press / right-click opens full vault) -->
        <div class="cred-unified-wrap" id="cred-unified-wrap">
            <button type="button" id="credentials-btn" class="tool-btn" style="position:relative" title="Credentials · Click to fill · Long-press or right-click for full vault · Ctrl+Alt+L">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M8 1.5a4 4 0 0 0-4 4v2H3a1 1 0 0 0-1 1v5a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-5a1 1 0 0 0-1-1h-1v-2a4 4 0 0 0-4-4z"/>
                    <circle cx="8" cy="6.5" r="1.3" fill="currentColor" stroke="none"/>
                </svg>
                <span class="tool-label">Creds</span>
                <span id="credentials-site-badge" class="rules-hit-badge cred-site-badge" aria-hidden="true"></span>
            </button>
            <div id="cred-popup" class="cred-popup hidden" role="dialog" aria-label="Credentials for this site">
                <div id="cred-popup-unlock" class="cred-popup-section hidden">
                    <label class="cred-popup-label" for="cred-popup-pw">Master password</label>
                    <div class="cred-popup-unlock-row">
                        <input type="password" id="cred-popup-pw" class="cred-popup-input" placeholder="Master password" autocomplete="current-password" spellcheck="false">
                        <button type="button" id="cred-popup-unlock-btn" class="cred-popup-primary-btn">Unlock</button>
                    </div>
                    <p id="cred-popup-unlock-err" class="cred-popup-err hidden" role="alert"></p>
                </div>
                <div id="cred-popup-list" class="cred-popup-section cred-popup-list hidden" role="menu"></div>
                <div id="cred-popup-empty" class="cred-popup-section cred-popup-empty hidden">
                    <p class="cred-popup-empty-text">No saved credentials for this page.</p>
                </div>
                <div class="cred-popup-footer">
                    <button type="button" id="cred-popup-open-vault" class="cred-popup-link-btn">Open Vault…</button>
                </div>
            </div>
        </div>

        <!-- System Console -->
        <button id="console-btn" class="tool-btn" title="System Console · Ctrl+Shift+K">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/>
                <path d="M4.5 6l2.5 2-2.5 2"/>
                <path d="M8.5 10.5h3"/>
            </svg>
            <span class="tool-label">Console</span>
        </button>

        <span class="tool-sep"></span>

        <!-- Settings -->
        <button id="settings-toggle-btn" class="tool-btn settings-toggle" title="Settings">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="8" cy="8" r="2.2"/>
                <path d="M8 1.5v1M8 13.5v1M1.5 8h1M13.5 8h1M3.4 3.4l.7.7M11.9 11.9l.7.7M3.4 12.6l.7-.7M11.9 4.1l.7-.7"/>
            </svg>
            <span class="tool-label">Settings</span>
        </button>

    </div>
    </div>
</div>

<!-- Compact tool row under the address bar (optional placement) -->
<div id="browser-tools-subbar" class="browser-tools-bar" data-mini-align="right" hidden aria-hidden="true">
    <div id="tool-dock-mount-subbar" class="tool-dock-mount"></div>
</div>

<!-- Credential save bar (auto-capture prompt) -->
<div id="credential-save-bar" class="cred-save-bar hidden">
    <div class="cred-save-inner">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" style="width:16px;height:16px;flex-shrink:0"><path d="M8 1l5.5 3v4c0 3.6-2.4 7-5.5 8-3.1-1-5.5-4.4-5.5-8V4L8 1z"/></svg>
        <span id="cred-save-text">Save password for <b id="cred-save-domain"></b>?</span>
        <span id="cred-save-login" style="color:var(--text-muted);font-size:12px;margin-left:4px"></span>
        <div id="cred-save-unlock-row" class="hidden" style="display:flex;align-items:center;gap:6px;margin-left:8px">
            <input type="password" id="cred-save-pw" placeholder="Master password" style="font-size:12px;padding:3px 8px;width:160px;background:var(--bg-secondary);color:var(--text);border:1px solid var(--border);border-radius:4px;">
        </div>
        <div style="display:flex;gap:6px;margin-left:auto">
            <button type="button" id="cred-save-yes" class="cred-save-btn cred-save-btn-primary">Save</button>
            <button type="button" id="cred-save-never" class="cred-save-btn">Never</button>
            <button type="button" id="cred-save-dismiss" class="cred-save-btn cred-save-btn-dismiss" title="Dismiss">&times;</button>
        </div>
    </div>
</div>

<!-- Rule notification toasts -->
<div id="rule-toast-container"></div>

<!-- Command palette backdrop only (omnibox list lives under #address-bar-container) -->
<div id="command-palette" class="command-palette command-palette--backdrop-only hidden" aria-hidden="true">
    <div class="command-palette-backdrop" id="command-palette-backdrop" aria-hidden="true"></div>
</div>

<!-- Window switcher overlay (Ctrl+`) -->
<div id="win-switcher-overlay" class="win-switcher-overlay" aria-hidden="true">
    <div class="win-switcher-dialog" role="dialog" aria-label="Window switcher">
        <div class="win-switcher-list" id="win-switcher-list"></div>
        <div class="win-switcher-hint" id="win-switcher-hint"></div>
    </div>
</div>

<!-- Compact tool row above the status bar (optional placement) -->
<div id="browser-tools-bottom" class="browser-tools-bar browser-tools-bar--bottom" data-mini-align="right" hidden aria-hidden="true">
    <div id="tool-dock-mount-bottom" class="tool-dock-mount"></div>
</div>

<!-- Mini tools — separate vertical strip on the right -->
<div id="browser-tools-separate" class="browser-tools-side" hidden aria-hidden="true">
    <div id="tool-dock-mount-separate" class="tool-dock-mount"></div>
</div>

<footer id="browser-status-bar" class="browser-status-bar" role="status" aria-live="polite">
    <span id="status-page" class="browser-status-item browser-status-item--page" title="Active tab load state">Page: —</span>
    <span class="browser-status-sep" aria-hidden="true">·</span>
    <span id="status-mitm" class="browser-status-item" title="MITM proxy">MITM: —</span>
    <span class="browser-status-sep" aria-hidden="true">·</span>
    <span id="status-proxy" class="browser-status-item" title="Proxy">Proxy: —</span>
    <span class="browser-status-sep" aria-hidden="true">·</span>
    <span id="status-ip" class="browser-status-item" title="Egress IP">IP: —</span>
    <span class="browser-status-sep" aria-hidden="true">·</span>
    <span id="status-requests" class="browser-status-item" title="Logged requests">Requests: —</span>
    <span class="browser-status-sep" aria-hidden="true">·</span>
    <span id="status-errors" class="browser-status-item" title="MITM / worker errors (recent)">Errors: —</span>
</footer>

<script src="toast-notifications.js"></script>
<script src="keyboard-shortcuts.js"></script>
<script src="browser-renderer.js"></script>
</body>
</html>
